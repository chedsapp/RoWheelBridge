name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: win-x64
            name: Windows x64
            extension: .exe
          - os: win-arm64
            name: Windows ARM64
            extension: .exe

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
      working-directory: src
    
    - name: Build and publish
      run: |
        dotnet publish -c Release -r ${{ matrix.os }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ../publish/${{ matrix.os }}
      working-directory: src
    
    - name: Create archive
      run: |
        cd ./publish/${{ matrix.os }}
        zip -r ../../RoWheelBridge-${{ matrix.os }}.zip .
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./RoWheelBridge-${{ matrix.os }}.zip
        asset_name: RoWheelBridge-${{ matrix.os }}.zip
        asset_content_type: application/zip